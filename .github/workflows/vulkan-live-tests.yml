# Live Vulkan tests (the `#[ignore = "requires a live Vulkan device"]` set), on the self-hosted Windows runner.
# Policy: agentlife docs/RUNNER-SETUP.md (push to main + workflow_dispatch only, NO pull_request trigger, no secrets).
# CireSnave 2026-10-16: tests GitHub cannot run go to a self-hosted run with the same conditions, never `#[ignore]`.
# Board 366/371: the repository's own restricted runner (ghr-fuel). DRAFT: do not merge before that runner exists.
#
# WHAT THIS COVERS (each is `-- --ignored`, run on the real GPU):
#   * fuel-dispatch (`vulkan`): vulkan_deferred_eviction_live (GAP-371 / ROADMAP row 142), vulkan_dispatch_live,
#     vulkan_write_slice_rotating_live
#   * fuel-vulkan-backend: every ignored test in the crate (tests/*_live and the in-crate probe/capture tests)
#   * fuel-tensor (`vulkan`): vulkan_bridge_realize_live
#
# WHAT THIS DOES NOT COVER, stated so a green is not read wider than it is:
#   * Anything needing CUDA (cuda_vulkan_* in fuel-tensor, the cuda-gated half of fuel-dispatch's ignored unit tests).
#   * The ignored `--lib` tests of fuel-dispatch (pipelined.rs, jit_ingest.rs, topology.rs): they mix CUDA and Vulkan
#     and have not been sorted into a Vulkan-only list. UNVERIFIED here.
#   * Model-level Vulkan tests in fuel-model-llama / fuel-model-phi.
#   * Any test whose device was not selected as the one under test: the runner may have two GPUs (a discrete card and
#     an iGPU); each test picks its own adapter.
#
# A GREEN IS NOT A PROOF THE TESTS RAN. Several of these tests return early with a bare `eprintln!("no Vulkan device;
# skipping")` and report `ok` when no device is present (vulkan_deferred_eviction_live, vulkan_bridge_realize_live,
# live_adapter, capture). Two guards: `FUEL_REQUIRE_VULKAN=1` (honoured by the tests that use
# fuel_test_support::hardware) and a final step that FAILS if any test printed "skipping" or if a step reported zero
# passed tests. The skip lines only appear with `--nocapture`, which every step uses.
name: vulkan-live-tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  FUEL_REQUIRE_VULKAN: "1"

jobs:
  vulkan-live:
    name: live Vulkan tests (self-hosted)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain visible to this account (fails loudly)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($t in 'rustup', 'cargo', 'rustc') {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            if (-not $c) { throw "$t is NOT on PATH for this account; the tests cannot run" }
            "$t : $($c.Source)"
          }
          rustc --version

      - name: MSVC environment (link.exe for the Rust MSVC target; fails loudly)
        shell: powershell
        run: |
          # Same step as cuda-metal-compile-check.yml (agentlife docs/RUNNER-SETUP.md section 2d).
          $ErrorActionPreference = 'Stop'
          $component = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "MSVC env: vswhere.exe not found at $vswhere" }
          $vs = & $vswhere -latest -products '*' -requires $component -property installationPath | Select-Object -First 1
          if (-not $vs) {
            $vs = & $vswhere -all -products '*' -requires $component -property installationPath | Select-Object -Last 1
            if ($vs) { Write-Warning "MSVC env: $vs is incomplete or needs a reboot; using it anyway" }
          }
          if (-not $vs) { throw "MSVC env: no Visual Studio install has the component $component" }
          $bat = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw "MSVC env: $bat does not exist" }
          $env:VSCMD_SKIP_SENDTELEMETRY = '1'
          $cmd = Join-Path $env:RUNNER_TEMP 'msvc-env.cmd'
          Set-Content -LiteralPath $cmd -Encoding Ascii -Value @('@echo off', "call `"$bat`" -arch=x64 -host_arch=x64 -no_logo", 'if errorlevel 1 exit /b 1', 'set')
          $dump = & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "MSVC env: VsDevCmd.bat failed (exit $LASTEXITCODE)" }
          $oldDirs = @($env:PATH -split ';')
          foreach ($line in $dump) {
            if ($line -notmatch '^([^=\s][^=]*)=(.*)$') { continue }
            $k = $Matches[1]; $v = $Matches[2]
            if ($k -ieq 'PATH') {
              $env:PATH = $v
              foreach ($d in ($v -split ';')) {
                if ($d -and ($oldDirs -notcontains $d)) { [IO.File]::AppendAllText($env:GITHUB_PATH, "$d`n") }
              }
            }
            elseif ([Environment]::GetEnvironmentVariable($k) -ne $v) {
              [IO.File]::AppendAllText($env:GITHUB_ENV, "$k=$v`n")
            }
          }
          if (-not (Get-Command link.exe -ErrorAction SilentlyContinue)) { throw "MSVC env: link.exe is not on PATH after VsDevCmd under $vs" }

      # One cargo invocation at a time, capped at -j 4. Each step tees its full output (with --nocapture, so the
      # skip lines are visible) to a file the last step reads; each runs even if an earlier one failed.
      - name: fuel-dispatch (vulkan) live tests
        if: always()
        shell: powershell
        run: |
          cargo test -j 4 --locked -p fuel-dispatch --features vulkan `
            --test vulkan_deferred_eviction_live --test vulkan_dispatch_live --test vulkan_write_slice_rotating_live `
            -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'vk-dispatch.log')
          exit $LASTEXITCODE

      - name: fuel-vulkan-backend live tests
        if: always()
        shell: powershell
        run: |
          cargo test -j 4 --locked -p fuel-vulkan-backend `
            -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'vk-backend.log')
          exit $LASTEXITCODE

      - name: fuel-tensor (vulkan) bridge live test
        if: always()
        shell: powershell
        run: |
          cargo test -j 4 --locked -p fuel-tensor --features vulkan `
            --test vulkan_bridge_realize_live `
            -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'vk-tensor.log')
          exit $LASTEXITCODE

      - name: Evidence the tests ran (a skip is not a pass; fails loudly)
        if: always()
        shell: powershell
        run: |
          $bad = 0
          foreach ($name in 'vk-dispatch', 'vk-backend', 'vk-tensor') {
            $f = Join-Path $env:RUNNER_TEMP "$name.log"
            if (-not (Test-Path -LiteralPath $f)) { "$name : NO LOG, the cargo step never ran"; $bad++; continue }
            $passed = 0
            foreach ($m in (Select-String -LiteralPath $f -Pattern 'test result: \w+\. (\d+) passed')) { $passed += [int]$m.Matches[0].Groups[1].Value }
            $skips = @(Select-String -LiteralPath $f -Pattern 'skipping' -SimpleMatch)
            "$name : $passed test(s) passed, $($skips.Count) 'skipping' line(s)"
            $skips | ForEach-Object { "  $($_.Line.Trim())" }
            if ($passed -eq 0) { "  FAIL: zero tests passed"; $bad++ }
            if ($skips.Count -gt 0) { "  FAIL: a test skipped for lack of a device"; $bad++ }
          }
          if ($bad -gt 0) { throw "$bad problem(s): a green cargo exit does not prove these tests ran" }
