# Hosted-macOS check of fuel's Metal shaders (ROADMAP row 172 follow-up; pm-kernels/PM ruling 2026-11-25).
#
# WHY: nothing compiled `fuel-metal-kernels/src/metal_src/*.metal` outside a Mac. The crate builds the
# sources at RUNTIME (`new_library_with_source`), so `cargo check` on macOS proves the Rust compiles and says
# nothing about the shader text. And no Mac is known to the lanes, so Metal numerics are UNMEASURED.
#
# WHAT THIS DOES, on a hosted `macos-latest` runner (ordinary hosted CI: no self-hosted runner, no secrets,
# `contents: read` only; NOT a required check at first):
#   1. compiles every `.metal` file with `xcrun -sdk macosx metal -c` (red if a file does not compile;
#      each file's result is printed, and every file is attempted even if an earlier one failed);
#   2. PROBES `MTLCreateSystemDefaultDevice()` and prints what the hosted VM returns. A hosted VM may expose NO
#      GPU: then the Metal numerics rows stay unmeasured BY DESIGN and the log says so.
#
# WHAT A GREEN DOES NOT SAY: that the shaders are numerically correct (nothing ran), and that the compile
# options match the runtime's (the runtime sets fast math ON by default via `MTLCompileOptions`; this step
# passes `-ffast-math` to match that default, and `-std=metal3.1` for bfloat).
name: metal-shader-check

on:
  pull_request:
    paths:
      - "fuel-metal-kernels/src/metal_src/**"
      - ".github/workflows/metal-shader-check.yml"
  push:
    branches: [main]
    paths:
      - "fuel-metal-kernels/src/metal_src/**"
      - ".github/workflows/metal-shader-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal-shaders:
    name: compile .metal (macOS) and probe the Metal device
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain visible
        run: |
          sw_vers
          xcrun --sdk macosx --find metal
          xcrun -sdk macosx metal --version

      - name: Compile every .metal file
        run: |
          set +e
          dir=fuel-metal-kernels/src/metal_src
          out="$(mktemp -d)"
          total=0; failed=0
          for f in "$dir"/*.metal; do
            total=$((total+1))
            if xcrun -sdk macosx metal -c -std=metal3.1 -ffast-math -I "$dir" "$f" -o "$out/$(basename "$f").air" 2> "$out/err.txt"; then
              echo "OK    $f"
            else
              failed=$((failed+1))
              echo "FAIL  $f"
              sed 's/^/      /' "$out/err.txt"
            fi
          done
          echo "compiled $((total-failed)) of $total .metal files ($failed failed)"
          [ "$total" -gt 0 ] || { echo "no .metal files found: the glob is wrong"; exit 2; }
          [ "$failed" -eq 0 ]

      - name: Probe the Metal device (record what the hosted runner exposes)
        if: always()
        run: |
          cat > /tmp/probe.swift <<'SWIFT'
          import Metal
          let all = MTLCopyAllDevices()
          print("MTLCopyAllDevices count = \(all.count)")
          for d in all { print("  device: \(d.name) lowPower=\(d.isLowPower) unifiedMemory=\(d.hasUnifiedMemory)") }
          if let d = MTLCreateSystemDefaultDevice() {
            print("MTLCreateSystemDefaultDevice = \(d.name)")
          } else {
            print("MTLCreateSystemDefaultDevice = NONE (no GPU exposed to this runner: Metal numerics stay unmeasured here)")
          }
          SWIFT
          swiftc -o /tmp/probe /tmp/probe.swift
          /tmp/probe
