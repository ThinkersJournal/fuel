reason = "four fuel-quantized sources are deliberately unstamped because they derive from llama.cpp / ggml (MIT), not from us: iq4.rs, iq_grid_types.rs, iq_grids.rs and tq_mx_types.rs. Each opens with a comment saying so and pointing at the licence text in THIRD-PARTY-NOTICES.md; an identifier line there would claim a licence we cannot grant. The rule reports the group as one finding located at the first file, so this one entry covers the four and nothing else."

# ---------------------------------------------------------------------------------------------------------------------------
# The architecture Fuel declares for itself (ARC/MOD programme, ROADMAP row 153; PM [TASK] arc-mod-programme). Normative:
# coderipper's ARC rules report where the code disagrees. Advisory, not gating. Crate level, plus one pair of module groups
# inside fuel-graph (the waived cycle below). Layers are bottom first: a component may depend on its own layer or any layer below.
# Derived from the committed workspace graph (`cargo metadata --no-deps`, normal and build dependencies; dev-dependencies are
# not judged), so it starts with no violation except the one waiver.

[architecture]
style = "layered"
# The number of waivers may only fall; there is one today. (Not read by coderipper 0.43.x: kept so the declaration is whole.)
ratchet = true
# ARC-007 (data owned by one component): Fuel has NO tables, collections or topics to own. Checked 2026-11-19 at 81a370eda: no
# database, queue or broker crate in Cargo.lock (rusqlite, sqlx, diesel, sled, rocksdb, redb, sea-orm, mongodb, redis, rdkafka,
# lapin, postgres: 0 hits, the same grep finds `name = "serde"`), 0 tracked `*.sql` files, 0 `CREATE TABLE` / `INSERT INTO`
# literals in `*.rs`. What Fuel persists is files (the Judge profile cache, checkpoints), which the EFX rules read, not data a
# component owns. Declare `owns_data` on a component and delete this line the day Fuel gains a store.
none = ["owns_data"]

# Leaf crates every other layer reads: the IR (dtypes, shapes, ops), the model-config vocabulary, and the kernel sources.
[[architecture.component]]
name = "foundation"
paths = ["fuel-ir", "fuel-model-core", "fuel-conv", "fuel-cpu-kernels", "fuel-vulkan-kernels", "fuel-metal-kernels", "fuel-kernels-source", "fuel-kv-pool"]
role = "policy"
volatility = "stable"

# The backend contract and the readers of external formats; they depend on the IR only.
[[architecture.component]]
name = "contract"
paths = ["fuel-backend-contract", "fuel-formats", "fuel-datasets"]
role = "policy"
volatility = "stable"

# Fixtures and test support: read by tests, read by no production crate.
[[architecture.component]]
name = "fixtures"
paths = ["fuel-test-support", "fuel-correctness-fixtures", "fuel-model-fixture", "fuel-model-umbrella-fixture"]
role = "test-support"

# `pure = true` (EFX-001) is declared ONLY where measured true: `coderipper check EFX-001` with graph, quantized and facade tagged
# read 43 files and found 0 of its 17 effect entries (file, network, environment, process, clock, randomness, thread). The
# instrument can find them: with all eight policy components tagged it read 463 files and found 134 effect references, none in
# these three. NOT tagged because they name effects today: foundation (std::env, std::fs), contract (std::fs: the format readers),
# dispatch (env, fs, clock, threads), tensor (fs, env, clock, rand, sleep), models (fs, env, rand, clock). `pure` means none of the
# listed effects is named, not referentially pure; `fuel-graph` is also not claimed free of interior mutability or locks.
# The lazy graph and its optimizer. Module groups are NOT declared inside it: its one module cycle (see the note at the end) runs
# over inline `crate::opt::` paths, which ARC-001's module graph does not follow (it reads `mod`/`use` edges), so a waiver for
# it would be reported as stale.
[[architecture.component]]
name = "graph"
paths = ["fuel-graph"]
role = "policy"
pure = true   # EFX-001: 0 effect references in its files, measured 2026-11-19 (see the note above the components)

[[architecture.component]]
name = "quantized"
paths = ["fuel-quantized"]
role = "policy"
pure = true   # EFX-001: 0 effect references in its files, measured 2026-11-19 (see the note above the components)

# One crate per target; each holds that target's storage, device and kernels glue and never decides strategy.
[[architecture.component]]
name = "backends"
paths = ["fuel-cpu-backend", "fuel-cuda-backend", "fuel-metal-backend", "fuel-vulkan-backend", "fuel-kiss-ref-backend"]
role = "adapter"
volatility = "volatile"

[[architecture.component]]
name = "loaders"
paths = ["fuel-loaders"]
role = "adapter"

# Hardware discovery, memory accounting, and the dispatcher that binds kernels to nodes.
[[architecture.component]]
name = "dispatch"
paths = ["fuel-hardware", "fuel-memory", "fuel-dispatch"]
role = "policy"

# The per-vendor kernel registration crates: they depend on the dispatcher, never the reverse.
[[architecture.component]]
name = "kernel-adapters"
paths = ["fuel-aocl-cpu-backend", "fuel-mkl-cpu-backend", "fuel-cuda-dispatch", "fuel-vulkan-dispatch"]
role = "adapter"
volatility = "volatile"

[[architecture.component]]
name = "tensor"
paths = ["fuel-tensor"]
role = "policy"

[[architecture.component]]
name = "models"
paths = ["fuel-model-llama", "fuel-model-phi", "fuel-nn", "fuel-posttrain", "fuel-transformers"]
role = "policy"

# The public facade crate.
[[architecture.component]]
name = "facade"
paths = ["fuel"]
role = "policy"
pure = true   # EFX-001: 0 effect references in its files, measured 2026-11-19 (see the note above the components)

[[architecture.component]]
name = "applications"
paths = ["fuel-inference", "fuel-onnx", "fuel-parallel", "fuel-tensor-tools", "fuel-training"]
role = "composition"

[[architecture.component]]
name = "examples"
paths = ["fuel-examples", "fuel-lazy-examples"]
role = "composition"

[[architecture.layer]]
name = "foundation"
components = ["foundation"]

[[architecture.layer]]
name = "contract"
components = ["contract", "fixtures"]

[[architecture.layer]]
name = "graph"
components = ["graph", "quantized"]

[[architecture.layer]]
name = "backends"
components = ["backends", "loaders"]

[[architecture.layer]]
name = "runtime"
components = ["dispatch"]

[[architecture.layer]]
name = "kernel-adapters"
components = ["kernel-adapters"]

[[architecture.layer]]
name = "tensor"
components = ["tensor"]

[[architecture.layer]]
name = "models"
components = ["models"]

[[architecture.layer]]
name = "facade"
components = ["facade"]

[[architecture.layer]]
name = "applications"
components = ["applications"]

[[architecture.layer]]
name = "examples"
components = ["examples"]

# ARC-003: what changes with hardware and vendor churn, which a stable component (foundation, contract) must not name. The
# backend crates, the vendor kernel libraries and the BLAS routes; feature `cfg` tests count too. Measured 2026-11-19 with
# `coderipper check ARC-003`: foundation 0 names, contract 0 names, so the declaration is true of the code today; the control,
# namespaces = ["std::", "serde"], counts 133 and 61 uses, so the matcher sees multi-segment paths. The 24 feature `cfg`
# attributes in foundation (`serde` x21, `dlpack` x2, `ug` x1) are a real Info finding, not suppressed: optional serialisation and
# interop gates, not hardware.
[architecture.volatile]
namespaces = ["baracuda", "vulkane", "fuel_cuda_backend", "fuel_vulkan_backend", "fuel_metal_backend", "fuel_cpu_backend", "fuel_aocl_cpu_backend", "fuel_mkl_cpu_backend", "intel_mkl_src", "onemkl"]
feature_cfg_in_policy = true

# ARC-006: a CEILING at today's measured size, not a judgement that this is the right size: `coderipper check ARC-006` at
# 81a370eda counts public items and the members of public types per component (models 7673, foundation 1916, dispatch 1478,
# tensor 848, graph 745, contract 333, quantized 95, facade 67). The budget is each number as measured, so growth is a finding
# and shrinking is free; lower a number when its component shrinks, never raise one without saying why in the same change.
# Components not listed (backends, kernel-adapters, loaders, applications, examples, fixtures) are adapters, composition or test
# support: no budget claimed.
[architecture.api_budget]
foundation = 1923   # raised from 1916 (+7, row 125 part 2): DeviceIdentity::from_str, IdentityParseError (type + 4 variants), identity_from_env, identity_from_value
contract = 333
graph = 745
quantized = 95
dispatch = 1492   # raised from 1478 (+14): +10 row 158 executor feed (BacklogLedger and its methods, estimate_static_ns, optimizer_trace backlog counters), +2 the feed gate (BACKLOG_FEED_ENV, set_backlog_feed_enabled), +2 retire on completion (BacklogLedger::add_until, retire_completed)
tensor = 851   # raised from 848 (+3, row 125 part 2): vulkan_backend::new_device_by_identity, new_device_from_env, DEVICE_ENV_VAR
models = 7673
facade = 66   # lowered from 67 (-1, row 167 part 4): `fuel::utils::has_mkl` removed with the `mkl` feature

# RECORDED EXCEPTION (not an `[[architecture.waiver]]`: the tool cannot see this edge, and a waiver for an unseen edge is reported
# stale). The fuel-graph module cycle (26 modules in one strongly connected set per coderipper MOD-002): `opt` reaches `registry`
# and `runtime_fused`, and `runtime_fused` calls back into `crate::opt` (`lower_to_base_map`, `base_map_hash`, `optimize`).
# Waived, not fixed, now: `opt` is the optimizer core (GPU/perf-adjacent), so cutting it needs a numeric golden and a graph
# node-count check first, and GAP-380 (b) is the higher-priority work. Owner: fuel lane. PM ruling fuel-mod002-C, 2026-11-13.
# Revisit: after GAP-380 (b) lands, ROADMAP row 154 (until then, MOD-002 reports it as advisory Low).
